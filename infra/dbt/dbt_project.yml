name: finguard
version: '1.0.0'
config-version: 2

profile: finguard

model-paths: ['models']
macro-paths: ['macros']
target-path: 'target'
clean-targets: ['target', 'dbt_packages']

models:
  finguard:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

vars:
  # Windows used by the analytics marts.
  lookback_days: 90
  fraud_loss_horizon_days: 30
